<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Confirmação de Presença</title>
    <meta http-equiv="refresh" content="0; url=/confirmar-presenca.html">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1f1c;
            color: #f3efe6;
            font-family: 'Inter', sans-serif;
        }
        .loader {
            text-align: center;
        }
        .loader .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(201,162,75,.1);
            border-top: 3px solid #c9a24b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader p {
            margin-top: 16px;
            color: #9fb3ac;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>A carregar página de confirmação...</p>
    </div>
</body>
</html>
